name: Build TeleCore Core

on:
  push:
    tags: ['v*']
    branches: [master, main]
    paths:
      - 'TeleCore.qpf'
      - 'TeleCore.qsf'
      - 'TeleCore.sdc'
      - 'TeleCore.sv'
      - 'rtl/**'
      - 'sys/**'
      - 'files.qip'
      - 'tools/build_core.sh'
      - '.github/workflows/build_core.yml'
  pull_request:
    paths:
      - 'TeleCore.qpf'
      - 'TeleCore.qsf'
      - 'TeleCore.sdc'
      - 'TeleCore.sv'
      - 'rtl/**'
      - 'sys/**'
      - 'files.qip'
      - 'tools/build_core.sh'
      - '.github/workflows/build_core.yml'
  workflow_dispatch:

jobs:
  build-core:
    runs-on: ubuntu-latest
    container: raetro/quartus:17.0
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build core
        run: ./tools/build_core.sh

      - name: Upload core artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telecore-core
          path: output_files/

      - name: Add to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          artifacts: |
            output_files/TeleCore.rbf
            output_files/TeleCore.sof
          generateReleaseNotes: true
