name: Build TeleCore Core

on:
  push:
    branches: [master, main]
    paths:
      - 'TeleCore.qpf'
      - 'TeleCore.qsf'
      - 'TeleCore.sdc'
      - 'TeleCore.sv'
      - 'rtl/**'
      - 'sys/**'
      - 'files.qip'
      - 'tools/build_core.sh'
      - '.github/workflows/build_core.yml'
  pull_request:
    paths:
      - 'TeleCore.qpf'
      - 'TeleCore.qsf'
      - 'TeleCore.sdc'
      - 'TeleCore.sv'
      - 'rtl/**'
      - 'sys/**'
      - 'files.qip'
      - 'tools/build_core.sh'
      - '.github/workflows/build_core.yml'
  workflow_dispatch:

jobs:
  build-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build core
        run: docker run --rm -v "$PWD":/build -w /build raetro/quartus:17.0 ./tools/build_core.sh

      - name: Upload core artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telecore-core
          path: output_files/


