name: Build PhoneBook Cartridge

on:
  push:
    branches: [master, main]
    paths:
      - 'games/phonebook.json'
      - 'tools/mkphonebook.py'
      - '.github/workflows/build_phonebook.yml'
  pull_request:
    paths:
      - 'games/phonebook.json'
      - 'tools/mkphonebook.py'
      - '.github/workflows/build_phonebook.yml'
  workflow_dispatch:

jobs:
  build-phonebook:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PhoneBook .pbk
        run: python3 tools/mkphonebook.py -i games/phonebook.json -o games/phonebook.pbk

      - name: Upload PhoneBook artifact
        uses: actions/upload-artifact@v4
        with:
          name: telecore-phonebook
          path: games/phonebook.pbk


