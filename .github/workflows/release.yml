name: Release TeleCore

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure build artifacts are available
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p artifacts

          TAG="${GITHUB_REF#refs/tags/}"

          fetch_artifact() {
            local workflow="$1"
            local artifact="$2"
            local run_id status conclusion pre_id

            run_id=$(gh run list --workflow "$workflow" --limit 1 \
                --json databaseId -q '.[0].databaseId' || true)

            if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
              status=$(gh run view "$run_id" --json status -q '.status' || true)
              if [ "$status" = "in_progress" ] || [ "$status" = "queued" ] || [ "$status" = "waiting" ]; then
                echo "Waiting for in-progress $workflow run $run_id..."
                gh run watch "$run_id" --exit-status
              fi
              conclusion=$(gh run view "$run_id" --json conclusion -q '.conclusion' || true)
              if [ "$conclusion" = "success" ]; then
                gh run download "$run_id" -n "$artifact" -D "artifacts/$artifact"
                return
              fi
            fi

            echo "No usable run for $workflow; dispatching on $TAG..."
            pre_id="$run_id"
            gh workflow run "$workflow" --ref "$TAG"

            run_id=""
            for _ in $(seq 1 30); do
              sleep 5
              run_id=$(gh run list --workflow "$workflow" --limit 5 \
                  --json databaseId -q '.[0].databaseId' || true)
              if [ -n "$run_id" ] && [ "$run_id" != "$pre_id" ] && [ "$run_id" != "null" ]; then
                break
              fi
            done

            if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
              echo "Could not find new run for $workflow" >&2
              exit 1
            fi

            echo "Waiting for $workflow run $run_id..."
            gh run watch "$run_id" --exit-status
            gh run download "$run_id" -n "$artifact" -D "artifacts/$artifact"
          }

          fetch_artifact build_roms.yml       telecore-roms
          fetch_artifact build_core.yml       telecore-core
          fetch_artifact build_phonebook.yml  telecore-phonebook

      - name: Add installer script
        run: |
          cp tools/update_TeleCore.sh artifacts/update_TeleCore.sh
          chmod +x artifacts/update_TeleCore.sh

      - name: Package release zip
        run: |
          cd artifacts
          zip -r ../telecore-release.zip .

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          artifacts: telecore-release.zip
          generateReleaseNotes: true
