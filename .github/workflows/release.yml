name: Release TeleCore

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm python3 zip

      - name: Build BIOS ROMs
        run: ./tools/build_bios.sh

      - name: Build core
        run: docker run --rm -v "$PWD":/build -w /build raetro/quartus:17.0 sh ./tools/build_core.sh

      - name: Build PhoneBook .pbk
        run: python3 tools/mkphonebook.py -i games/phonebook.json -o games/phonebook.pbk

      - name: Build Settings .nvr
        run: python3 tools/mksettings.py -o games/settings.nvr

      - name: Package release zip
        run: |
          mkdir -p staging
          cp output_files/TeleCore.rbf staging/TeleCore.rbf
          cp bios/boot0.rom bios/boot1.rom bios/addon.rom staging/
          cp rtl/fallback.hex staging/
          cp games/phonebook.pbk games/settings.nvr staging/
          cp tools/update_TeleCore.sh staging/update_TeleCore.sh
          chmod +x staging/update_TeleCore.sh
          cd staging
          zip -r ../telecore-release.zip .

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          artifacts: telecore-release.zip
          generateReleaseNotes: true
